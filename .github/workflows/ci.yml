name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg
        # pydub shells out to ffmpeg for anything that is not a plain WAV.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pcddj_engine/story-to-script/requirements.txt
            backend/narration_tts/requirements.txt
            backend/audio_engine/requirements.txt

      - name: Install CPU-only PyTorch
        # sentence-transformers pulls torch, and the default Linux wheel bundles
        # CUDA (multi-GB). Nothing in backend/ touches a GPU, so install the CPU
        # wheel first and let the resolve below see the requirement as satisfied.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dependencies
        # Order matters. audio_engine pins numpy==2.3.3 / scipy==1.16.2, which
        # DOWNGRADES the 2.4.x the NLP group pulls in. That downgrade is
        # deliberate and verified ABI-compatible, so audio_engine goes LAST for
        # its pins to win. Mirrors setup.sh - if you change one, change the other.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install -r backend/pcddj_engine/story-to-script/requirements.txt
          pip install -r backend/narration_tts/requirements.txt
          pip install -r backend/audio_engine/requirements.txt

      - name: Register in-repo engine packages (editable)
        # Required, not a convenience: the directories asset_engine/ and
        # audio_engine/ shadow the real packages one level down, and the Stage 2
        # render runs `python audio_engine/main.py` as a subprocess whose
        # `from audio_engine...` import only resolves once the package is
        # installed. --no-deps so pip cannot re-resolve the pins settled above.
        # See backend/engine_paths.py.
        run: |
          pip install --no-deps -e backend/audio_engine
          pip install --no-deps -e backend/asset_engine
          pip install --no-deps -e backend/pcddj_engine/story-to-script

      - name: Download spaCy models
        # Both are needed, for different reasons:
        #   en_core_web_sm - loaded explicitly by the shared `nlp` test fixture.
        #   en_core_web_lg - the CLI's default. tests/test_cli_smoke.py shells out
        #                    to `python -m cli process` without naming a model, so
        #                    it exercises that default and fails with OSError E050
        #                    if only the small model is present.
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download en_core_web_lg

      # Each suite is its own step so a failure names the engine that broke.
      - name: asset_engine
        working-directory: backend/asset_engine
        run: pytest -q

      - name: api
        working-directory: backend
        run: pytest api/ -q

      - name: audio_engine
        working-directory: backend/audio_engine
        run: pytest -q

      - name: narration_tts
        working-directory: backend/narration_tts
        run: pytest -q

      - name: story-to-script
        working-directory: backend/pcddj_engine/story-to-script
        run: pytest -q

      - name: Working tree must be clean after the tests
        # Tests used to render WAVs into the tree and create real project folders
        # under workspace/. Both are fixed; this keeps them fixed.
        # See docs/TESTING.md.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The test run modified the working tree:"
            git status --porcelain
            exit 1
          fi

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Warnings are not fatal: the two outstanding ones are react-hooks
        # exhaustive-deps on page components, where adding the missing deps
        # would change render behaviour rather than fix a bug.
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        # The test runner deliberately omits the Tailwind v4 plugin, so only a
        # real build exercises it. See frontend/vitest.config.js.
        run: npm run build
